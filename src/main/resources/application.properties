spring.application.name=erp-1
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/erp2db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.security.username=${AUTH_USERNAME:}
app.security.password=${AUTH_PASSWORD:}
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-issuer=erp-1
app.security.access-token-ttl-seconds=900
app.security.refresh-token-ttl-seconds=604800